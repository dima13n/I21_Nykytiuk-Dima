<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Техно Маркет</h1>
            <nav class="nav">
                <a href="#">Головна</a>
                <a href="#">Каталог</a>
                <a href="#">Про нас</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h2 class="section-title">Каталог товарів</h2>
            <div class="products-grid">
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=1" alt="Товар 1">
                    <h3>Смартфон Pro</h3>
                    <p class="price">12 499 грн</p>
                    <button>Купити</button>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=2" alt="Товар 2">
                    <h3>Ноутбук Ultra</h3>
                    <p class="price">28 999 грн</p>
                    <button>Купити</button>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=3" alt="Товар 3">
                    <h3>Бездротові навушники</h3>
                    <p class="price">2 599 грн</p>
                    <button>Купити</button>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=4" alt="Товар 4">
                    <h3>Смарт-годинник</h3>
                    <p class="price">4 899 грн</p>
                    <button>Купити</button>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=5" alt="Товар 5">
                    <h3>Планшет Air</h3>
                    <p class="price">15 299 грн</p>
                    <button>Купити</button>
                </div>
                <div class="product-card">
                    <img src="https://picsum.photos/300/200?random=6" alt="Товар 6">
                    <h3>Електрична зубна щітка</h3>
                    <p class="price">1 499 грн</p>
                    <button>Купити</button>"
                </div>
            </div>
        </div>
    </main>
</body>
</html>
