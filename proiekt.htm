<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивний інтернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="site-header">
        <div class="container header-container">
            <h1 class="logo">ТехноМаркет</h1>
            <nav class="nav-menu">
                <a href="#">Головна</a>
                <a href="#">Каталог</a>
                <a href="#">Про нас</a>
                <a href="#">Контакти</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <h2>Каталог товарів</h2>
            <div class="products-grid">

                <article class="product-card">
                    <img src="https://picsum.photos/300/200?random=1" alt="Товар 1">
                    <h3>Смартфон Pro</h3>
                    <p class="price"> 12 499 грн</p>
                    <button class="buy-btn">Купити</button>
                </article>

                <article class="product-card">
                    <img src="https://picsum.photos/300/200?random=2" alt="Товар 2">
                    <h3>Ноутбук Ultra</h3>
                    <p class="price">28 999 грн</p>
                    <button class="buy-btn">Купити</button>
                </article>

                <article class="product-card">
                    <img src="https://picsum.photos/300/200?random=3" alt="Товар 3">
                    <h3>Бездротові навушники</h3>
                    <p class="price">2 299 грн</p>
                    <button class="buy-btn">Купити</button>
                </article>

                 <article class="product-card">
                    <img src="https://picsum.photos/300/200?random=4" alt="Товар 4">
                    <h3>Спортивний годинник</h3>
                    <p class="price">4 500 грн</p>
                    <button class="buy-btn">Купити</button>
                </article>

                 <article class="product-card">
                    <img src="https://picsum.photos/300/200?random=5" alt="Товар 5">
                    <h3>Планшет Media</h3>
                    <p class="price">15 800 грн</p>
                    <button class="buy-btn">Купити</button>
                </article>

                 <article class="product-card">
                    <img src="https://picsum.photos/300/200?random=6" alt="Товар 6">
                    <h3>Електрична камера</h3>
                    <p class="price">19 300 грн</p>
                    <button class="buy-btn">Купити</button>
                </article>

            </div>
        </div>
    </main>
    
</body>
</html>
